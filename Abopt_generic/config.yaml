use_GPU: True
device: cuda:0
interpreter_device: cuda:0

n_action: 2
interpretive_method: rand  # rand fix
use_non_dominated_sort: True
use_dynamic_weights: True

n_data_sample: 10
weighted_samples: False
threshold: 0.7

epoch: 20
mini_epoch: 15
batch_size: 256
# epoch: 1
# mini_epoch: 1
# batch_size: 1
lr: 0.002
scheduler_step: 2
scheduler_gamma: 0.8
epsilon: 0.2  # ppo loss clip boundarys
save_model_path: hgfr_model